name: Test and Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Cache npm download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Emit generated lockfile for repository bootstrap (temporary)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node -e "const fs=require('node:fs'); const s=fs.readFileSync('package-lock.json','utf8'); const b=Buffer.from(s).toString('base64'); console.log('LOCKFILE_START'); for(let i=0;i<b.length;i+=8000) console.log('LOCKFILE_CHUNK:'+i+':'+b.slice(i,i+8000)); console.log('LOCKFILE_END')"
      - name: Install bubblewrap for sandbox verification
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y bubblewrap
          fi
      - name: Audit dependency tree
        run: npm audit --audit-level=high
      - name: Run test suite
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Validate DSH plugin contract
        run: npm run validate
