name: Test and Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Cache npm download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install bubblewrap for sandbox verification
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y bubblewrap
          fi
      - name: Audit dependency tree
        run: npm audit --audit-level=high
      - name: Run test suite
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build and verify installable package
        run: |
          npm run build
          node --input-type=module -e 'import assert from "node:assert/strict"; import { existsSync, readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); assert.ok(existsSync(pkg.main), "package main entry must exist after build"); const mod = await import("./" + pkg.main); assert.equal(typeof mod.apply, "function", "built entry must export apply");'
          npm pack --dry-run --json > /tmp/dsh-forge-pack.json
          node --input-type=module -e 'import assert from "node:assert/strict"; import { readFileSync } from "node:fs"; const report = JSON.parse(readFileSync("/tmp/dsh-forge-pack.json", "utf8")); assert.equal(report.length, 1); assert.ok(report[0].files.some(file => file.path === "lib/index.js"), "published package must contain lib/index.js");'
      - name: Validate DSH plugin contract
        run: npm run validate
